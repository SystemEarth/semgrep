# Builds the Semgrep CE image SystemEarth's SAST workflow runs. Lives only on
# SystemEarth release branches of this fork, never on upstream-tracking develop.
name: "SystemEarth: publish Semgrep CE image"

on:
  push:
    tags: ["v*-se.*"]

permissions:
  contents: read

concurrency:
  group: systemearth-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'SystemEarth/semgrep' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/systemearth/semgrep
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Some upstream tags commit generated sources as Git LFS pointer text
      # whose objects are not public, so core cannot compile. Fail in seconds.
      - name: Reject Git LFS pointer files
        run: |
          if git grep -l '^version https://git-lfs.github.com/spec/v1' -- languages libs src; then
            echo "::error::Generated sources above are LFS pointers; choose an upstream tag with real sources"
            exit 1
          fi

      - id: meta
        name: Derive image tag from the release tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semgrep-oss is the CE stage: it stops before the Pro install step.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: semgrep-oss
          platforms: linux/amd64
          build-args: |
            VCS_REF_HEAD_NAME=${{ github.ref_name }}
            VCS_REF_HEAD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LGPL-2.1
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: mode=max
          sbom: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test the regression
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/smoke
          printf 'interface A {\n  a: number\n  in_b: number\n}\n' >/tmp/smoke/a.ts
          docker run --rm -v /tmp/smoke:/src "$REF" semgrep scan --metrics=off \
            --lang ts -e '$X' --json --output /src/out.json /src/a.ts
          jq -e '.errors | length == 0' /tmp/smoke/out.json
          echo "### ${REF}" >>"$GITHUB_STEP_SUMMARY"
